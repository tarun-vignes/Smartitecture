name: Smartitecture CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: Website/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: Website

    - name: Build website
      run: npm run build
      working-directory: Website
      
    # We'll add deployment steps later when ready

  test-desktop:
    name: Build and Test Desktop
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore Smartitecture.sln

    - name: Build
      run: dotnet build Smartitecture.sln -c Release --no-restore

    - name: Test
      run: dotnet test Smartitecture.sln -c Release --no-build
