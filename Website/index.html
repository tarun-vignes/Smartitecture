    <meta name="description" content="Get to know your Windows PC with Smartitecture. Check a slow computer, find everyday shortcuts, and get help in your own words." />
    <title>Smartitecture | Your PC, a little less complicated</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Smartitecture | Your PC, a little less complicated" />
    <meta property="og:description" content="A helping hand for your everyday Windows PC. Explore the Smartitecture beta." />
    <meta property="og:image" content="/smartitecture-favicon.svg" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Accessibility features -->
    <script>
      // Check if user prefers reduced motion
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) {
        document.documentElement.classList.add('reduce-motion');
      }
      
      // Check if user prefers high contrast
      const prefersHighContrast = window.matchMedia('(prefers-contrast: high)').matches;
      if (prefersHighContrast) {
        document.documentElement.classList.add('high-contrast');
      }
    </script>
  </body>
</html>
